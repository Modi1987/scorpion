name: CI Build and Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Build workspace container
        run: |
          docker-compose -f .devcontainer/docker-compose.yaml up --build -d scorpion-ros2
          
      - name: Run test container
        run: |
          docker-compose -f .devcontainer/docker-compose.yaml up scorpion-ros2-test
          
      - name: Tear down
        run: docker-compose -f .devcontainer/docker-compose.yaml down
