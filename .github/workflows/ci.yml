name: CI Build and Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check Docker and Docker Compose versions
        run: |
          docker --version
          docker-compose --version || echo "Docker Compose not installed"

      - name: Install Docker Compose (if needed)
        run: |
          DOCKER_COMPOSE_VERSION=2.10.2  # Or the latest version
          if ! command -v docker-compose &> /dev/null; then
            sudo curl -L "https://github.com/docker/compose/releases/download/v$DOCKER_COMPOSE_VERSION/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Remove nvidia runtime for CI
        run: |
          sed -i 's/runtime: nvidia//g' .devcontainer/docker-compose.yaml

      - name: Build workspace container
        run: |
          docker-compose -f .devcontainer/docker-compose.yaml up --build -d penta-jazzy-ros2
          
      - name: Run test container
        run: |
          docker-compose -f .devcontainer/docker-compose.yaml up penta-jazzy-ros2-test
          
      - name: Tear down
        run: docker-compose -f .devcontainer/docker-compose.yaml down
