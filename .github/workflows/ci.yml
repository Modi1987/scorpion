name: CI Build and Test

on:
  push:
    branches:
      - "*"       # Triggers on any branch
  pull_request:
    branches:
      - "*"       # Also triggers on any branch for pull requests

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Build and run docker-compose
        run: |
          docker-compose -f .devcontainer/docker-compose.yaml up --build -d scorpion-ros2
          
      - name: Run test container
        run: |
          docker-compose -f .devcontainer/docker-compose.yaml up scorpion-ros2-test
          
      - name: Tear down
        run: docker-compose -f .devcontainer/docker-compose.yaml down
